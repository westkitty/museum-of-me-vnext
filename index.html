<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Museum of Me — The Reliquary of Iterative Becoming</title>
    <meta
      name="description"
      content="A persistent first-person museum of seventy-three projects, presented through thirty-five exhibits across six wings."
    />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0d14'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23c9a227' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23c9a227'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui/museum.css" />
  </head>
  <body>
    <canvas id="museum-canvas" aria-hidden="true"></canvas>

    <!-- Accessible mirror of the world. Screen readers and keyboard users get the
         museum's text without needing to walk to it. Populated at runtime. -->
    <main id="a11y-root" class="a11y-root" aria-label="Museum of Me — accessible museum contents"></main>

    <div id="ui-root" class="ui-root"></div>

    <noscript>
      <div class="noscript">
        <h1>Museum of Me</h1>
        <p>
          This museum is a real-time 3D environment and requires JavaScript and WebGL. The full text of
          every exhibit is also available in the accessible contents once scripting is enabled.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
