name: museum development gate

# One current CI run per PR or main update; no duplicate branch-push runs.
concurrency:
  group: museum-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: canonical development gate
        run: npm run gate

  browser:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: build production-style museum artifact
        run: npm run build
      - name: install Chromium
        run: npx playwright install --with-deps chromium
      - name: real browser visitor-path gate
        run: npm run test:e2e
      - name: Capture cinematic review screenshots (non-acceptance evidence)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/cinematic-monumental-museum-2026-10-11'
        continue-on-error: true
        env:
          PW_TEST_SCREENSHOT_NO_FONTS_READY: '1'
        run: node scripts/capture-cinematic-evidence.mjs
      - name: Upload cinematic review evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feature/cinematic-monumental-museum-2026-10-11'
        uses: actions/upload-artifact@v4
        with:
          name: museum-cinematic-visual-${{ github.sha }}
          path: test-results/cinematic-review/
          if-no-files-found: warn
          retention-days: 7

  workshop:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install Chromium
        run: npx playwright install --with-deps chromium
      - name: development-only Museum Workshop authoring gate
        run: npm run test:workshop

  standalone:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install Chromium
        run: npx playwright install --with-deps chromium
      - name: build standalone museum with authored placement runtime
        run: npm run build:standalone
      - name: fresh offline standalone verification
        run: npm run verify:standalone
